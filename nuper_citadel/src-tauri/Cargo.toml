[package]
name = "nuper-citadel"
version = "1.0.0"
description = "Nuper Citadel - Savunma Sanayii Kalifikasyon ve Pre-FEA Mühendislik İstasyonu"
authors = ["Nuper Citadel Team"]
edition = "2021"

[lib]
name = "nuper_citadel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
