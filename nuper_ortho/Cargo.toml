[workspace]
members = [
    "crates/ortho-ast",
    "crates/ortho-brep",
    "crates/ortho-kinematics",
    "crates/ortho-router",
    "crates/ortho-emitter",
    "crates/ortho-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nuper Ortho Team"]
license = "Proprietary"

[workspace.dependencies]
# Lineer Cebir, Vektör ve Dönüşüm Matematiği
glam = { version = "0.29", features = ["serde"] }
approx = "0.5"

# Paralelleştirme ve Yüksek Performans
rayon = "1.10"

# Serileştirme ve AST Kayıt
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Şablon Motoru (DMIS / PC-DMIS Emitter)
tera = "1.19"

# C++ FFI Köprüsü (OpenCASCADE B-Rep)
cxx = "1.0"

# Çizge Eşleme (2D PDF to 3D STEP Bipartite Matching)
petgraph = "0.6"

# Süpürülmüş Kapsül ve GJK/EPA Çarpışma Fiziği
parry3d = "0.13"

# Hata Yönetimi ve Günlükleme (Logging & Diagnostics)
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
